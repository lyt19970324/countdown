<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>倒计日</title>
<link rel="apple-touch-icon" href="icon.png?v=5">
<link rel="icon" type="image/png" href="icon.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="倒计日">
<style>
  :root {
    --bg1: #0f1226;
    --bg2: #1a1040;
    --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.12);
    --text: #f2f3fb;
    --muted: #9aa0b8;
    --accent1: #7c6cff;
    --accent2: #28d9c4;
    --warn: #ffb54d;
    --danger: #ff6b81;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(124,108,255,0.22), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(40,217,196,0.15), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--text);
    min-height:100vh;
    display:flex; justify-content:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
  }
  .wrap { width:100%; max-width:560px; }

  .app-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .app-title { font-size:22px; font-weight:800; letter-spacing:12px; display:flex; align-items:center; gap:8px;
    background:linear-gradient(90deg,#fff,#c9c5ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .header-btns { display:flex; gap:8px; }
  .header-btns button { background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--muted); font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:20px; cursor:pointer; }
  .header-btns button:active { background:rgba(255,255,255,0.18); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:18px 16px 16px; margin-bottom:16px; backdrop-filter:blur(14px); animation:pop .25s ease; position:relative; }
  @keyframes pop { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .card-actions { position:absolute; top:14px; right:14px; display:flex; gap:8px; }
  .icon-btn { width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,0.08);
    color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:active { background:rgba(255,255,255,0.18); }
  .icon-btn.del:active { background:rgba(255,107,129,0.2); color:var(--danger); }

  .card-title { text-align:center; font-size:22px; font-weight:800; margin-top:8px; }
  .card-date { text-align:center; font-size:13px; color:var(--muted); margin-top:4px; }

  .big-days { text-align:center; font-size:80px; font-weight:800; line-height:1;
    background:linear-gradient(180deg,#8aa4ff 0%,#4facfe 60%,#28d9c4 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; margin-top:10px; }
  .days-label { text-align:center; font-size:16px; color:var(--muted); margin-top:-4px; margin-bottom:14px; }

  .work-pill { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 auto 10px;
    background:rgba(255,255,255,0.08); border:1px solid var(--border); border-radius:30px;
    padding:12px 24px; width:fit-content; font-size:15px; color:#fff; }
  .work-pill span { font-size:30px; font-weight:800; color:var(--accent2); }
  .big-days.past {
    background:linear-gradient(180deg,#ffd166 0%,#ffb54d 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .days-label.past { color:var(--warn); }
  .past-label { text-align:center; font-size:16px; color:var(--warn); margin-top:10px; margin-bottom:-4px; }
  .exact-countdown.past { color:var(--warn); }
  .exact-countdown.past b { color:var(--warn); }
  .work-pill.past span { color:var(--warn); }

  .rest-detail { text-align:center; font-size:12px; color:var(--muted); line-height:1.6; padding:0 6px; }
  .exact-countdown { text-align:center; font-size:14px; color:var(--muted); margin-top:10px; letter-spacing:1px; }
  .exact-countdown b { color:#fff; font-weight:700; }

  .wd-toggle-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; padding-top:14px;
    border-top:1px solid var(--border); font-size:13px; color:var(--muted); }
  .switch { position:relative; display:inline-block; width:40px; height:24px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:rgba(255,255,255,0.15); border-radius:24px; transition:.3s; }
  .slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.3s; }
  .switch input:checked + .slider { background:var(--accent1); }
  .switch input:checked + .slider:before { transform:translateX(16px); }

  /* 小组件网格 */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .widget { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:14px 12px 16px;
    backdrop-filter:blur(14px); animation:pop .25s ease; position:relative; }
  .widget-actions { position:absolute; top:12px; right:12px; display:flex; gap:6px; }
  .widget-actions button { width:26px; height:26px; border-radius:50%; border:none; background:rgba(255,255,255,0.08);
    color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .widget-name { font-size:15px; font-weight:700; margin-top:8px; padding-right:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .widget-num { text-align:center; font-size:42px; font-weight:800; margin-top:10px;
    background:linear-gradient(180deg,#8aa4ff 0%,#4facfe 60%,#28d9c4 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .widget-num span { font-size:14px; color:var(--muted); }
  .widget.past .widget-num { background:linear-gradient(180deg,#ffd166 0%,#ffb54d 100%); -webkit-background-clip:text; background-clip:text; }
  .widget.past .widget-num span { color:var(--warn); }
  .widget-work { text-align:center; font-size:13px; color:var(--accent2); font-weight:700; margin-top:4px; }
  .widget-work.past { color:var(--warn); }

  /* 内联添加表单 */
  .add-form .field { margin-bottom:12px; }
  .add-form label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .add-form input[type="text"], .add-form input[type="date"] { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
    background:rgba(255,255,255,0.05); color:#fff; font-size:15px; }
  .add-form input[type="date"] { color-scheme:dark; }
  .add-form input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(1); }
  .form-toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:14px; }
  .add-submit { width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#fff; }
  .add-submit:active { opacity:0.85; }
  .cancel-edit { width:100%; padding:10px; margin-top:8px; border:none; border-radius:10px; font-size:13px;
    background:rgba(255,255,255,0.08); color:var(--muted); cursor:pointer; display:none; }

  /* 快捷设置 */
  .quick-title { font-size:13px; color:var(--muted); font-weight:700; margin:24px 0 10px; letter-spacing:1px; }
  .quick-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 14px; backdrop-filter:blur(14px); }
  .quick-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; }
  .quick-row .lbl { font-size:14px; }
  .quick-row .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin:6px 0 4px; }
  .chips button { padding:7px 11px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,255,255,0.05); color:var(--muted); font-size:12px; cursor:pointer; }
  .chips button.on { background:var(--accent1); color:#fff; border-color:var(--accent1); }
  .extra-item { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05);
    padding:7px 11px; border-radius:8px; margin-top:6px; font-size:12px; }
  .extra-item button { background:transparent; border:none; color:var(--danger); font-size:13px; cursor:pointer; }
  .add-extra { display:flex; gap:8px; margin-top:8px; }
  .add-extra input[type="date"] { flex:1; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    background:rgba(255,255,255,0.05); color:#fff; color-scheme:dark; font-size:13px; }
  .add-extra button { padding:9px 14px; border:none; border-radius:8px; background:var(--accent1); color:#fff; cursor:pointer; font-weight:600; font-size:13px; }
  .backup-btns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .backup-btns button { padding:9px 12px; border:1px solid var(--border); border-radius:8px;
    background:rgba(255,255,255,0.08); color:#fff; cursor:pointer; font-weight:600; font-size:13px; }
  .backup-btns button:active { background:rgba(255,255,255,0.18); }
  #restoreBox textarea { width:100%; height:88px; padding:10px; border:1px solid var(--border); border-radius:8px;
    background:rgba(255,255,255,0.05); color:#fff; font-size:12px; font-family:inherit; resize:vertical; }
  #restoreBox button { width:100%; margin-top:8px; padding:11px; border:none; border-radius:8px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .empty-tip { text-align:center; color:var(--muted); padding:34px 0 10px; font-size:14px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div class="app-title">⏳ 倒 计 日</div>
    <div class="header-btns">
      <button id="viewBtn">小组件</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="empty-tip" id="emptyTip" style="display:none">
    还没有倒计日<br>在下方添加一个吧
  </div>

  <!-- 内联添加/编辑表单 -->
  <div class="card add-form" id="addForm">
    <div class="field">
      <label>事件名称（可选）</label>
      <input id="f_name" type="text" placeholder="如：考试 / 生日 / 放假">
    </div>
    <div class="field">
      <label>目标时间</label>
      <input id="f_date" type="date">
    </div>
    <div class="form-toggle">
      <label class="switch"><input type="checkbox" id="f_showWork" checked><span class="slider"></span></label>
      显示「除去休息日」倒计时
    </div>
    <button class="add-submit" id="f_submit">＋ 添加</button>
    <button class="cancel-edit" id="f_cancel">取消编辑</button>
  </div>

  <!-- 快捷设置 -->
  <div id="quickWrap">
    <div class="quick-title">快捷设置</div>
    <div class="quick-card">
      <div class="quick-row">
        <div>
          <div class="lbl">计入法定节假日与调休</div>
          <div class="sub">自动识别放假与补班日</div>
        </div>
        <label class="switch"><input type="checkbox" id="s_legal"><span class="slider"></span></label>
      </div>
      <div class="quick-row" style="display:block">
        <div class="lbl">每周休息日</div>
        <div class="chips" id="s_weeks">
          <button data-d="1">一</button><button data-d="2">二</button>
          <button data-d="3">三</button><button data-d="4">四</button>
          <button data-d="5">五</button><button data-d="6">六</button><button data-d="0">日</button>
        </div>
      </div>
      <div class="quick-row" style="display:block">
        <div class="lbl">自定义休息日</div>
        <div id="s_extra"></div>
        <div class="add-extra">
          <input type="date" id="s_extra_date">
          <button id="s_extra_add">添加</button>
        </div>
      </div>
      <div class="quick-row" style="display:block">
        <div class="lbl">数据备份</div>
        <div class="sub">清除浏览器数据或换手机前，先备份一份</div>
        <div id="backupStatus" style="font-size:12px;margin-top:6px"></div>
        <div class="backup-btns">
          <button id="s_backup_file">备份到文件</button>
          <button id="s_backup_copy">复制备份</button>
          <button id="s_restore_show">恢复数据</button>
        </div>
        <div id="restoreBox" style="display:none;margin-top:10px">
          <textarea id="restoreText" placeholder="把之前备份的内容整段粘贴到这里"></textarea>
          <button id="s_restore_go">确认恢复</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var STORE_KEY = "countdown-app-v2";
var LEGAL_REST = {
  "2025-01-01":"元旦", "2025-01-28":"春节", "2025-01-29":"春节", "2025-01-30":"春节", "2025-01-31":"春节",
  "2025-02-01":"春节", "2025-02-02":"春节", "2025-02-03":"春节", "2025-02-04":"春节",
  "2025-04-04":"清明节", "2025-04-05":"清明节", "2025-04-06":"清明节",
  "2025-05-01":"劳动节", "2025-05-02":"劳动节", "2025-05-03":"劳动节", "2025-05-04":"劳动节", "2025-05-05":"劳动节",
  "2025-05-31":"端午节", "2025-06-01":"端午节", "2025-06-02":"端午节",
  "2025-10-01":"国庆节", "2025-10-02":"国庆节", "2025-10-03":"国庆节", "2025-10-04":"国庆节",
  "2025-10-05":"国庆节", "2025-10-06":"国庆节", "2025-10-07":"国庆节", "2025-10-08":"国庆节",
  "2026-01-01":"元旦", "2026-01-02":"元旦", "2026-01-03":"元旦",
  "2026-02-15":"春节", "2026-02-16":"春节", "2026-02-17":"春节", "2026-02-18":"春节",
  "2026-02-19":"春节", "2026-02-20":"春节", "2026-02-21":"春节", "2026-02-22":"春节", "2026-02-23":"春节",
  "2026-04-04":"清明节", "2026-04-05":"清明节", "2026-04-06":"清明节",
  "2026-05-01":"劳动节", "2026-05-02":"劳动节", "2026-05-03":"劳动节", "2026-05-04":"劳动节", "2026-05-05":"劳动节",
  "2026-06-19":"端午节", "2026-06-20":"端午节", "2026-06-21":"端午节",
  "2026-09-25":"中秋节", "2026-09-26":"中秋节", "2026-09-27":"中秋节",
  "2026-10-01":"国庆节", "2026-10-02":"国庆节", "2026-10-03":"国庆节", "2026-10-04":"国庆节",
  "2026-10-05":"国庆节", "2026-10-06":"国庆节", "2026-10-07":"国庆节"
};
var LEGAL_WORK = {
  "2025-01-26":true, "2025-02-08":true, "2025-04-27":true, "2025-09-28":true, "2025-10-11":true,
  "2026-01-04":true, "2026-02-14":true, "2026-02-28":true, "2026-05-09":true,
  "2026-09-20":true, "2026-10-10":true
};

var state = {
  restDays: [6,0],
  extraRest: [],
  useLegal: true,
  items: [],
  editingId: null,
  view: "detail"
};

function migrate(old) {
  var items = [];
  var oldItems = old.items || old.countdowns || [];
  for (var i=0;i<oldItems.length;i++){
    var it = oldItems[i];
    items.push({
      id: it.id || "it" + Math.random().toString(36).slice(2),
      name: it.name || it.title || "倒计日",
      target: it.target || it.date || "",
      showWork: it.showWork !== undefined ? it.showWork : true
    });
  }
  return {
    restDays: old.restDays || [6,0],
    extraRest: old.extraRest || [],
    useLegal: old.useLegal !== false,
    items: items,
    editingId: null,
    view: old.view || "detail"
  };
}

function load(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data.items) {
      state.restDays = data.restDays || [6,0];
      state.extraRest = data.extraRest || [];
      state.useLegal = data.useLegal !== false;
      state.items = data.items || [];
      state.view = data.view || "detail";
    } else {
      state = migrate(data);
    }
  } catch(e) {}
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}

function dayStart(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function dateStr(d){ var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),dd=("0"+d.getDate()).slice(-2); return y+"-"+m+"-"+dd; }
function diffDays(a,b){ return Math.round((dayStart(b)-dayStart(a))/86400000); }
function weekName(d){ return ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]; }

function restType(d){
  var ds = dateStr(d);
  if (state.extraRest.indexOf(ds) !== -1) return "user";
  if (state.useLegal && LEGAL_REST[ds]) return "legal";
  if (state.useLegal && LEGAL_WORK[ds]) return "makeup";
  if (state.restDays.indexOf(d.getDay()) !== -1) return "week";
  return false;
}

function countDays(from, to, excludeEnd){
  var work=0,rest=0,week=0,legal=0,extra=0,makeup=0;
  var d = new Date(dayStart(from));
  d.setDate(d.getDate()+1);
  var end = dayStart(to);
  if (excludeEnd) end.setDate(end.getDate()-1);
  while (d <= end) {
    var t = restType(d);
    if (t==="user"){rest++;extra++;}
    else if (t==="legal"){rest++;legal++;}
    else if (t==="week"){rest++;week++;}
    else if (t==="makeup"){work++;makeup++;}
    else {work++;}
    d.setDate(d.getDate()+1);
  }
  return {work:work,rest:rest,week:week,legal:legal,extra:extra,makeup:makeup};
}

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function restDetailText(c){
  if (c.rest===0) return "期间无休息日";
  var s=[];
  if (c.week>0) s.push("周末 "+c.week+"天");
  if (c.legal>0) s.push("法定假日 "+c.legal+"天");
  if (c.extra>0) s.push("自定义 "+c.extra+"天");
  var t = "期间共有 "+c.rest+" 天休息日（"+s.join(" + ")+"）";
  if (c.makeup>0) t += " · 补班日 "+c.makeup+" 天已计入工作日";
  return t;
}

function exactCountdown(targetDate){
  var now = new Date();
  var diff = targetDate - now;
  var prefix = diff >= 0 ? "精确倒计时" : "已过去";
  diff = Math.abs(diff);
  var days = Math.floor(diff / 86400000);
  diff %= 86400000;
  var hours = Math.floor(diff / 3600000);
  diff %= 3600000;
  var minutes = Math.floor(diff / 60000);
  diff %= 60000;
  var seconds = Math.floor(diff / 1000);
  return prefix + " <b>"+days+"</b> 天 <b>"+hours+"</b> 时 <b>"+minutes+"</b> 分 <b>"+seconds+"</b> 秒";
}

var listEl, emptyEl, viewBtn, addForm, submitBtn, cancelBtn, nameInput, dateInput, showWorkInput;
var intervalId = null;

function render(){
  if (state.view==="mini") renderMini(); else renderDetail();
  emptyEl.style.display = state.items.length===0 ? "" : "none";
  viewBtn.textContent = state.view==="mini" ? "详细视图" : "小组件";
  document.getElementById("quickWrap").style.display = state.view==="mini" ? "none" : "";
  addForm.style.display = state.view==="mini" ? "none" : "";
  renderBackupStatus();
  save();
  startTick();
}

function startTick(){
  if (intervalId) clearInterval(intervalId);
  updateExact();
  intervalId = setInterval(updateExact, 1000);
}
function updateExact(){
  document.querySelectorAll(".exact-countdown").forEach(function(el){
    var target = new Date(el.dataset.target);
    el.innerHTML = exactCountdown(target);
  });
}

function renderDetail(){
  if (state.items.length===0){ listEl.innerHTML=""; return; }
  var now=new Date();
  var nowStart=dayStart(now);
  var sorted=state.items.slice();
  var html="";
  sorted.forEach(function(item){
    var target=dayStart(item.target);
    var diff=diffDays(nowStart,target);
    var showWork = item.showWork !== false;
    html += '<div class="card" data-id="'+esc(item.id)+'">';
    html += '<div class="card-actions">';
    html += '<button class="icon-btn edit" data-act="edit" data-id="'+esc(item.id)+'">✎</button>';
    html += '<button class="icon-btn del" data-act="del" data-id="'+esc(item.id)+'">×</button>';
    html += '</div>';
    html += '<div class="card-title">'+esc(item.name)+'</div>';
    html += '<div class="card-date">'+esc(item.target.replace(/-/g,"年 ").replace(/\s/g,"月 ") + "日 " + weekName(target))+'</div>';
    if (diff > 1) {
      html += '<div class="big-days">'+(diff-1)+'</div><div class="days-label">天</div>';
      if (showWork) {
        var wd = countDays(nowStart, target, true);
        html += '<div class="work-pill">除去休息日还有 <span>'+wd.work+'</span> 天</div>';
        html += '<div class="rest-detail">'+restDetailText(wd)+'</div>';
      }
      html += '<div class="exact-countdown" data-target="'+esc(item.target)+'T00:00:00">'+exactCountdown(target)+'</div>';
    } else if (diff === 1) {
      html += '<div class="big-days" style="font-size:46px">明天</div>';
      if (showWork) {
        var wd1 = countDays(nowStart, target, true);
        html += '<div class="work-pill">除去休息日还有 <span>'+wd1.work+'</span> 天</div>';
        html += '<div class="rest-detail">'+restDetailText(wd1)+'</div>';
      }
      html += '<div class="exact-countdown" data-target="'+esc(item.target)+'T00:00:00">'+exactCountdown(target)+'</div>';
    } else if (diff === 0) {
      html += '<div class="big-days" style="font-size:46px">今天</div>';
      html += '<div class="exact-countdown" data-target="'+esc(item.target)+'T00:00:00">'+exactCountdown(target)+'</div>';
    } else {
      html += '<div class="past-label">已过去</div>';
      html += '<div class="big-days past">'+Math.abs(diff)+'</div><div class="days-label past">天</div>';
    }
    if (diff > 0) {
      html += '<label class="wd-toggle-row"><span class="switch"><input type="checkbox" data-act="toggleWork" data-id="'+esc(item.id)+'"'+(showWork?" checked":"")+'><span class="slider"></span></span>是否计算除开休息日</label>';
    }
    html += '</div>';
  });
  listEl.innerHTML=html;
}

function renderMini(){
  if (state.items.length===0){ listEl.innerHTML=""; return; }
  var now=new Date();
  var nowStart=dayStart(now);
  var sorted=state.items.slice();
  var html='<div class="grid">';
  sorted.forEach(function(item){
    var target=dayStart(item.target);
    var diff=diffDays(nowStart,target);
    var showWork = item.showWork !== false;
    html += '<div class="widget'+(diff<0?' past':'')+'" data-id="'+esc(item.id)+'">';
    html += '<div class="widget-actions">';
    html += '<button data-act="edit" data-id="'+esc(item.id)+'">✎</button>';
    html += '<button data-act="del" data-id="'+esc(item.id)+'">×</button>';
    html += '</div>';
    html += '<div class="widget-name">'+esc(item.name)+'</div>';
    var num = diff === 0 ? "今天" : (diff === 1 ? "明天" : (diff > 1 ? diff-1 : Math.abs(diff)));
    html += '<div class="widget-num'+(diff<0?' past':'')+'">'+num+'<span>天</span></div>';
    if (diff > 1) {
      var d = countDays(nowStart,target,true);
      html += '<div class="widget-work">除休息日 '+d.work+' 天</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  listEl.innerHTML=html;
}

function startEdit(id){
  state.editingId = id;
  var item=state.items.find(function(x){return x.id===id;});
  if (!item) return;
  nameInput.value=item.name;
  dateInput.value=item.target;
  showWorkInput.checked = item.showWork !== false;
  submitBtn.textContent="保存修改";
  cancelBtn.style.display="block";
  addForm.scrollIntoView({behavior:"smooth"});
}
function cancelEdit(){
  state.editingId=null;
  nameInput.value="";
  dateInput.value="";
  showWorkInput.checked=true;
  submitBtn.textContent="＋ 添加";
  cancelBtn.style.display="none";
}

function submitForm(){
  var name=nameInput.value.trim();
  var date=dateInput.value;
  if (!date) { alert("请选择目标时间"); return; }
  if (!name) name = date;
  if (state.editingId) {
    var item=state.items.find(function(x){return x.id===state.editingId;});
    if (item){ item.name=name; item.target=date; item.showWork = showWorkInput.checked; }
  } else {
    state.items.push({ id:"it"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:name, target:date, showWork: showWorkInput.checked });
  }
  cancelEdit();
  render();
}

function renderExtra(){
  var el=document.getElementById("s_extra");
  if (state.extraRest.length===0){ el.innerHTML='<div style="font-size:11px;color:var(--muted);margin-top:4px">暂无</div>'; return; }
  var html="";
  state.extraRest.slice().sort().forEach(function(ds){
    var name=LEGAL_REST[ds]||"";
    html+='<div class="extra-item"><span>'+ds+(name?" "+esc(name):"")+'</span><button data-extra="'+esc(ds)+'">删除</button></div>';
  });
  el.innerHTML=html;
}

function renderSettings(){
  document.getElementById("s_legal").checked = state.useLegal;
  document.querySelectorAll("#s_weeks button").forEach(function(b){
    b.classList.toggle("on", state.restDays.indexOf(parseInt(b.dataset.d,10)) !== -1);
  });
  renderExtra();
}

document.addEventListener("click", function(e){
  var t=e.target;

  if (t.id==="viewBtn"){ state.view = state.view==="mini" ? "detail" : "mini"; render(); return; }

  var actEl=t.closest("[data-act]");
  if (actEl){
    var act=actEl.dataset.act, id=actEl.dataset.id;
    if (act==="edit"){ startEdit(id); return; }
    if (act==="del"){
      if (confirm("确定删除这个倒计日？")){
        state.items=state.items.filter(function(x){return x.id!==id;});
        if (state.editingId===id) cancelEdit();
        render();
      }
      return;
    }
    if (act==="toggleWork"){
      var item=state.items.find(function(x){return x.id===id;});
      if (item){ item.showWork = actEl.checked; save(); render(); }
      return;
    }
  }

  if (t.id==="f_submit" || t.closest("#f_submit")){ submitForm(); return; }
  if (t.id==="f_cancel" || t.closest("#f_cancel")){ cancelEdit(); return; }

  if (t.id==="s_extra_add" || t.closest("#s_extra_add")){
    var d=document.getElementById("s_extra_date").value;
    if (!d) { alert("请选择日期"); return; }
    if (state.extraRest.indexOf(d)===-1) state.extraRest.push(d);
    document.getElementById("s_extra_date").value="";
    renderExtra(); save();
    return;
  }
  var extraDel=t.closest("[data-extra]");
  if (extraDel){
    state.extraRest=state.extraRest.filter(function(x){return x!==extraDel.dataset.extra;});
    renderExtra(); save();
    return;
  }
  var weekBtn=t.closest("#s_weeks button");
  if (weekBtn){
    var wd=parseInt(weekBtn.dataset.d,10);
    var idx=state.restDays.indexOf(wd);
    if (idx===-1) state.restDays.push(wd); else state.restDays.splice(idx,1);
    renderSettings(); save(); render();
    return;
  }
});

document.addEventListener("change", function(e){
  if (e.target.id==="s_legal"){
    state.useLegal=e.target.checked; save(); render();
  }
});

/* 备份与恢复 */
var BACKUP_KEY = "countdown-backup-meta";
function backupPayload(){
  return JSON.stringify({ app:"countdown-backup", v:1,
    restDays:state.restDays, extraRest:state.extraRest, useLegal:state.useLegal, items:state.items, view:state.view });
}
function saveBackupMeta(){
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ time:Date.now(), sig:backupPayload() })); } catch(e){}
}
function renderBackupStatus(){
  var el=document.getElementById("backupStatus");
  if (!el) return;
  var raw=null;
  try { raw=localStorage.getItem(BACKUP_KEY); } catch(e){}
  if (!raw){ el.innerHTML='<span style="color:var(--muted)">还没备份过，建议先备份一次</span>'; return; }
  var meta=null;
  try { meta=JSON.parse(raw); } catch(e){}
  if (!meta || !meta.time){ el.innerHTML='<span style="color:var(--muted)">还没备份过，建议先备份一次</span>'; return; }
  var d=new Date(meta.time);
  var tstr=(d.getMonth()+1)+"月"+d.getDate()+"日 "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  if (meta.sig===backupPayload()){
    el.innerHTML='<span style="color:var(--accent2)">上次备份：'+tstr+' · 数据一致 ✓</span>';
  } else {
    el.innerHTML='<span style="color:var(--warn)">⚠ 数据有变化，建议重新备份</span>';
  }
}
function copyText(text, okMsg, onOk){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove();
    alert(ok ? okMsg : "复制失败，请改用“备份到文件”");
    if (ok && onOk) onOk();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ alert(okMsg); if (onOk) onOk(); }, fallback);
  } else fallback();
}
document.addEventListener("click", function(e){
  var t=e.target;
  if (t.id==="s_backup_file"){
    var data=backupPayload();
    var blob=new Blob([data],{type:"text/plain"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="倒计日备份-"+dateStr(new Date())+".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
    saveBackupMeta(); renderBackupStatus();
    alert("已生成备份文件！请在弹窗里选择“存储到文件”，建议存到 iCloud 云盘");
    return;
  }
  if (t.id==="s_backup_copy"){
    copyText(backupPayload(),"已复制！打开备忘录新建一条，粘贴保存即可", function(){ saveBackupMeta(); renderBackupStatus(); });
    return;
  }
  if (t.id==="s_restore_show"){
    var box=document.getElementById("restoreBox");
    box.style.display = box.style.display==="none" ? "block" : "none";
    return;
  }
  if (t.id==="s_restore_go"){
    var txt=document.getElementById("restoreText").value.trim();
    if (!txt){ alert("请先粘贴备份内容"); return; }
    var data=null;
    try{ data=JSON.parse(txt); }catch(e){ data=null; }
    if (!data || !data.items){ alert("备份内容不对，请确认粘贴的是完整备份"); return; }
    if (!confirm("恢复将覆盖当前所有倒计日和设置，确定继续？")) return;
    state.restDays=data.restDays||[6,0];
    state.extraRest=data.extraRest||[];
    state.useLegal=data.useLegal!==false;
    state.items=data.items;
    state.view=data.view||"detail";
    save(); renderSettings(); render();
    document.getElementById("restoreBox").style.display="none";
    document.getElementById("restoreText").value="";
    alert("恢复成功！"+state.items.length+" 个倒计日已找回");
    return;
  }
});

document.addEventListener("DOMContentLoaded", function(){
  listEl=document.getElementById("list");
  emptyEl=document.getElementById("emptyTip");
  viewBtn=document.getElementById("viewBtn");
  addForm=document.getElementById("addForm");
  submitBtn=document.getElementById("f_submit");
  cancelBtn=document.getElementById("f_cancel");
  nameInput=document.getElementById("f_name");
  dateInput=document.getElementById("f_date");
  showWorkInput=document.getElementById("f_showWork");
  load();
  renderSettings();
  render();
});
</script>
